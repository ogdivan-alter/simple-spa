# ============================================================
# Override de STAGING (paridad local).
# Ejecuta la imagen publicada con tag :staging, como la consume
# el servicio de staging en la nube.
#
# Uso:
#   docker compose -f compose.yaml -f compose.staging.yaml up
# ============================================================
services:
  spa:
    image: ogdivan/simple-spa:${STAGING_TAG:-staging}
    pull_policy: always
