<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Saludo</title>
</head>
<body>
    <h1 id="saludo"></h1>

    <script>
        const params = new URLSearchParams(window.location.search);
        const quien = params.get("quien");

        const itemSaludo = document.getElementById("saludo");
        itemSaludo.textContent = `Bienvenido ${quien}`
    </script>
</body>
</html>
