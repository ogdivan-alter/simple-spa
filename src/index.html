<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPA Saludo</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: indigo;
            font-family: Arial, sans-serif;
        }

        #saludo {
            color: aqua;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 id="saludo"></h1>

    <script>
        const params = new URLSearchParams(window.location.search);
        const quien = params.get("quien");

        const itemSaludo = document.getElementById("saludo");
        itemSaludo.textContent = quien ? `${quien} está por aquí` : "Alguien está por aquí?";
    </script>
</body>
</html>
