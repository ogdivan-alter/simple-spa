name: ci

# Validación automática en cada Pull Request hacia las ramas de entorno.
# Construye la imagen y comprueba con Docker Compose que la SPA responde.
on:
  pull_request:
    branches: [develop, main, production]

# Evita ejecuciones duplicadas para la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build y smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir la imagen y levantar el stack (Docker Compose)
        run: |
          docker compose \
            -f docker/compose/compose.yaml \
            -f docker/compose/compose.dev.yaml \
            up -d --build

      - name: Smoke test (espera HTTP 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/ >/dev/null; then
              echo "Smoke test OK"
              exit 0
            fi
            echo "esperando a que responda... ($i/15)"
            sleep 2
          done
          echo "::error::Smoke test fallido (sin HTTP 200)"
          docker compose -f docker/compose/compose.yaml -f docker/compose/compose.dev.yaml logs
          exit 1

      - name: Bajar el stack
        if: always()
        run: |
          docker compose \
            -f docker/compose/compose.yaml \
            -f docker/compose/compose.dev.yaml \
            down -v
