name: cd

# Build + push de la imagen a Docker Hub al integrar en `main` (entorno *staging*)
# o en `production` (entorno *production*).
# Tras el push, dispara el deploy hook de Render del environment correspondiente.
on:
  push:
    branches: [main, production]
  workflow_dispatch: {}

# Evita ejecuciones solapadas por rama (main y production corren en paralelo).
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ogdivan/simple-spa

jobs:
  build-push:
    name: Build y push a Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Leer versión
        id: ver
        run: echo "version=$(tr -d ' \r\n' < docker/version/VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref == 'refs/heads/production' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Staging: se dispara al integrar en `main`.
  deploy-staging:
    name: Deploy staging (Render)
    needs: [build-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Disparar deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$HOOK"

  # Producción: se dispara al integrar en `production` (requiere aprobación del Environment).
  deploy-production:
    name: Deploy production (Render)
    needs: [build-push]
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Disparar deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$HOOK"
